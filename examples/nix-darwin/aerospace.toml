[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp' # WhatsApp
run = 'layout floating'

# Every other new window splits the window it opened next to, across that window's container, as
# Hyprland's default layout does: noren's dwindle part does that, after the rules
# above have floated their windows. It counts on these rules matching by app id only; a rule
# matching the window title (if.window-title-regex-substring) could run after noren looks.

# While a Jump Desktop session window (a Linux desktop's screen) is focused, noren puts AeroSpace in this mode,
# which releases every binding, and stops kanata swapping Ctrl and Cmd, so the same keys reach
# Hyprland there; focusing anything else restores both (its focus rule in home.nix). Only the
# launcher key stays local, to leave the remote session.
[mode.passthrough.binding]
f18 = 'exec-and-forget @profile@/bin/vicinae toggle'
