<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1f26"/>
      <stop offset="1" stop-color="#0b0c0f"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f5f9e"/>
      <stop offset="1" stop-color="#1d3d6b"/>
    </linearGradient>
    <linearGradient id="rod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c79a63"/>
      <stop offset="1" stop-color="#8a6236"/>
    </linearGradient>
  </defs>
  <!-- The tile, on macOS's icon grid: 824 of 1024, inset 100 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <!-- Two panels of cloth with the slit between them, hanging from the rod -->
  <path d="M232 330 H504 V716 Q440 736 378 712 Q300 684 232 704 Z" fill="url(#cloth)"/>
  <path d="M520 330 H792 V708 Q722 728 656 712 Q590 696 520 712 Z" fill="url(#cloth)"/>
  <!-- A chip on the right panel, like the focused workspace in the bar -->
  <rect x="609" y="470" width="94" height="58" rx="29" fill="#61afef"/>
  <!-- The rod, across the top -->
  <rect x="196" y="300" width="632" height="38" rx="19" fill="url(#rod)"/>
</svg>
